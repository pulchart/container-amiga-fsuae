name: Images

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# cancel older builds of a pull request, let master runs wait
concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

env:
  REGISTRY: ghcr.io/pulchart
  HADOLINT: docker.io/hadolint/hadolint:v2.15.1
  ACTIONLINT: docker.io/rhysd/actionlint:1.7.12
  # a pull request from this repository, which may push and attest
  OWN_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
  # a manual run on master, which publishes its own build
  RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
  # tag of the tested images in the -pr packages
  TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('run-{0}', github.run_id) }}
  # dorny/paths-filter: the files whose change makes a pull request build images
  IMAGE_FILES: |
    images:
      - Containerfile
      - os-source.sh
      - .github/workflows/images.yml

jobs:
  base:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      build: ${{ github.event_name != 'pull_request' || steps.changes.outputs.images == 'true' }}
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Check whether the pull request changes the images
        if: github.event_name == 'pull_request'
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ env.IMAGE_FILES }}
      - name: Report a pull request without image changes
        if: github.event_name == 'pull_request' && steps.changes.outputs.images != 'true'
        run: echo "No change to the image files, no images built" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: hadolint
        run: podman run --rm -i "$HADOLINT" hadolint - <Containerfile
      - name: actionlint
        run: podman run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT" -color
      - name: Build amiga-fsuae
        if: github.event_name != 'pull_request' || steps.changes.outputs.images == 'true'
        id: build
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          podman build --target base -t amiga-fsuae .
          eval "$(podman run --rm amiga-fsuae sh -c 'echo "fedora=$(rpm -E %fedora)"
            echo "fsuae=$(rpm -q --qf "%{VERSION}" fs-uae)"
            echo "amitools=$(python3 -c "import importlib.metadata as m; print(m.version(\"amitools\"))")"')"
          podman build --target base --label "fedora.version=$fedora" --label "fsuae.version=$fsuae" \
            --label "amitools.version=$amitools" --label "build.date=$(date -u +%Y%m%d)" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$fsuae" -t amiga-fsuae .
          echo "Fedora $fedora, FS-UAE $fsuae, amitools $amitools" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push amiga-fsuae
        if: steps.build.outcome == 'success' && (env.OWN_PR == 'true' || env.RELEASE == 'true')
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          podman push --digestfile digest amiga-fsuae "$REGISTRY/amiga-fsuae-pr:$TAG"
          podman logout ghcr.io
          { echo "digest=$(cat digest)"; echo "ref=$REGISTRY/amiga-fsuae-pr@$(cat digest)"; } >>"$GITHUB_OUTPUT"
      - name: Attest amiga-fsuae
        if: steps.push.outcome == 'success'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/pulchart/amiga-fsuae
          subject-digest: ${{ steps.push.outputs.digest }}

  # each OS on the base of this run; a pull request from a fork builds its own base
  os:
    needs: base
    if: needs.base.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: aros
            test: test
          - os: apolloos
            test: apolloos-test
    env:
      OS: ${{ matrix.os }}
      BASE: ${{ needs.base.outputs.ref || 'base' }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        if: env.OWN_PR == 'true' || env.RELEASE == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      # reuse the OS of an earlier image with the same <os>.build
      - name: Find the ${{ matrix.os }} source
        id: src
        env:
          PR: ${{ github.event.number }}
        run: |
          stage() { awk -v s="$1" '/^FROM /{p = ($NF == s)} p' Containerfile; }
          build=$( { stage os-build; stage "$OS-build"; grep -E "^ARG ${OS^^}_(COMMIT|PRS)=" Containerfile; cat os-source.sh; } |
                   sha256sum | cut -c1-12)
          source=$OS-build
          candidates=("$REGISTRY/amiga-fsuae-$OS:latest")
          [ "$OWN_PR" = true ] && candidates=("$REGISTRY/amiga-fsuae-$OS-pr:pr-$PR" "${candidates[@]}")
          for image in "${candidates[@]}"; do
            if ! found=$(skopeo inspect --format "{{index .Labels \"$OS.build\"}}|{{.Digest}}" "docker://$image" 2>&1); then
              echo "$image: ${found##*: }"
              continue
            fi
            IFS='|' read -r label digest <<<"$found"
            if [ "$label" = "$build" ]; then
              source="${image%:*}@$digest"
              break
            fi
            echo "$image: $OS.build '$label', needs $build"
          done
          echo "$OS from $source on $BASE"
          { echo "build=$build"; echo "source=$source"; } >>"$GITHUB_OUTPUT"
      - name: Build and boot ${{ matrix.os }}
        env:
          SOURCE: ${{ steps.src.outputs.source }}
          BUILD: ${{ steps.src.outputs.build }}
          TEST: ${{ matrix.test }}
        run: |
          args=(--build-arg "BASE=$BASE" --build-arg "${OS^^}_SOURCE=$SOURCE")
          podman build --target "$OS" "${args[@]}" -t "amiga-fsuae-$OS" .
          podman build --target "$TEST" "${args[@]}" .
          version=$(podman run --rm "amiga-fsuae-$OS" sed -n 's/^date=//p' "/opt/$OS-rom/source")
          [ -n "$version" ] || { echo "amiga-fsuae-$OS: no date in /opt/$OS-rom/source" >&2; exit 1; }
          podman build --target "$OS" "${args[@]}" --label "org.opencontainers.image.version=$version" \
            --label "$OS.version=$version" --label "$OS.build=$BUILD" -t "amiga-fsuae-$OS" .
          echo "$OS $version from \`$SOURCE\`, the $TEST stage passed" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push amiga-fsuae-${{ matrix.os }}
        if: env.OWN_PR == 'true' || env.RELEASE == 'true'
        id: push
        run: |
          podman push --digestfile digest "amiga-fsuae-$OS" "$REGISTRY/amiga-fsuae-$OS-pr:$TAG"
          echo "digest=$(cat digest)" >>"$GITHUB_OUTPUT"
      - name: Attest amiga-fsuae-${{ matrix.os }}
        if: steps.push.outcome == 'success'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/pulchart/amiga-fsuae-${{ matrix.os }}
          subject-digest: ${{ steps.push.outputs.digest }}

  # the required check
  images:
    needs: [base, os]
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - name: Check the image jobs
        env:
          BASE: ${{ needs.base.result }}
          OS: ${{ needs.os.result }}
        run: |
          echo "base $BASE, os $OS"
          [ "$BASE" = success ] && { [ "$OS" = success ] || [ "$OS" = skipped ]; }

  # a manual run on master: the images it tested get the release tags
  release:
    needs: [base, os, images]
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Copy the tested images to the release tags
        if: needs.images.result == 'success'
        id: copy
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          table=$(.github/scripts/publish.sh "$TAG" "$GITHUB_SHA")
          skopeo logout ghcr.io
          printf 'Published the images of run %s\n\n%s\n' "$GITHUB_RUN_ID" "$table" >>"$GITHUB_STEP_SUMMARY"
      - name: Keep the newest 10 tagged versions of each image
        if: steps.copy.outcome == 'success'
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: amiga-fsuae,amiga-fsuae-aros,amiga-fsuae-apolloos
          keep-n-tagged: 10
          delete-untagged: true
      - name: Delete the run images
        if: always() && steps.copy.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/delete-pr-images.sh "$TAG" >>"$GITHUB_STEP_SUMMARY"

  closed:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Check whether the pull request changed the images
        if: github.event.pull_request.merged && github.event.pull_request.base.ref == 'master'
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ env.IMAGE_FILES }}
      - name: Report a merge without image changes
        if: steps.changes.outputs.images == 'false'
        run: echo "No change to the image files, nothing published" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Copy the pull request images to the release tags
        if: steps.changes.outputs.images == 'true'
        id: copy
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          table=$(.github/scripts/publish.sh "$TAG" "$HEAD")
          skopeo logout ghcr.io
          printf 'Published the images tested in pull request #%s\n\n%s\n' "${TAG#pr-}" "$table" >>"$GITHUB_STEP_SUMMARY"
          echo "copied=true" >>"$GITHUB_OUTPUT"
      - name: Keep the newest 10 tagged versions of each image
        if: steps.copy.outputs.copied == 'true'
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: amiga-fsuae,amiga-fsuae-aros,amiga-fsuae-apolloos
          keep-n-tagged: 10
          delete-untagged: true
      - name: Delete the pull request images
        if: always() && steps.copy.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/delete-pr-images.sh "$TAG" >>"$GITHUB_STEP_SUMMARY"
