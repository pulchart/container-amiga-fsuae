name: Images

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# cancel older builds of a pull request, let master runs wait
concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/pulchart
  HADOLINT: docker.io/hadolint/hadolint:v2.15.1
  ACTIONLINT: docker.io/rhysd/actionlint:1.7.12

jobs:
  images:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: hadolint
        run: podman run --rm -i "$HADOLINT" hadolint - <Containerfile
      - name: actionlint
        run: podman run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT" -color
      - name: Build and boot AROS
        run: |
          podman build --target base -t amiga-fsuae .
          podman build --target aros -t amiga-fsuae-aros .
          podman build --target test .
      - name: Read the versions in the images
        id: v
        run: |
          {
            podman run --rm amiga-fsuae sh -c 'echo "fedora=$(rpm -E %fedora)"
              echo "fsuae=$(rpm -q --qf "%{VERSION}" fs-uae)"
              echo "amitools=$(python3 -c "import importlib.metadata as m; print(m.version(\"amitools\"))")"'
            echo "aros=$(podman image inspect amiga-fsuae-aros --format '{{index .Labels "aros.version"}}')"
            echo "date=$(date -u +%Y%m%d)"
          } | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
      - name: Push the pull request images to GHCR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR: ${{ github.event.number }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          for image in amiga-fsuae amiga-fsuae-aros; do
            podman tag "$image" "$REGISTRY/$image-pr:pr-$PR"
            podman push "$REGISTRY/$image-pr:pr-$PR"
          done
          podman logout ghcr.io
      - name: Label, tag and push to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        id: push
        env:
          FEDORA: ${{ steps.v.outputs.fedora }}
          FSUAE: ${{ steps.v.outputs.fsuae }}
          AMITOOLS: ${{ steps.v.outputs.amitools }}
          AROS: ${{ steps.v.outputs.aros }}
          DATE: ${{ steps.v.outputs.date }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels=(--label "fedora.version=$FEDORA" --label "fsuae.version=$FSUAE" --label "amitools.version=$AMITOOLS")
          podman build --target base "${labels[@]}" --label "org.opencontainers.image.version=$FSUAE" \
            -t "$REGISTRY/amiga-fsuae:latest" .
          podman build --target aros "${labels[@]}" --label "org.opencontainers.image.version=$AROS" \
            -t "$REGISTRY/amiga-fsuae-aros:latest" .
          podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          for tag in "$FSUAE" "$FSUAE-$DATE" latest; do
            podman push --digestfile fsuae.digest "$REGISTRY/amiga-fsuae:latest" "$REGISTRY/amiga-fsuae:$tag"
          done
          for tag in "$AROS" "$AROS-$DATE" latest; do
            podman push --digestfile aros.digest "$REGISTRY/amiga-fsuae-aros:latest" "$REGISTRY/amiga-fsuae-aros:$tag"
          done
          podman logout ghcr.io
          echo "fsuae=$(cat fsuae.digest)" >>"$GITHUB_OUTPUT"
          echo "aros=$(cat aros.digest)" >>"$GITHUB_OUTPUT"
      - name: Attest amiga-fsuae
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/pulchart/amiga-fsuae
          subject-digest: ${{ steps.push.outputs.fsuae }}
      - name: Attest amiga-fsuae-aros
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/pulchart/amiga-fsuae-aros
          subject-digest: ${{ steps.push.outputs.aros }}
      - name: Keep the newest 10 versions of amiga-fsuae
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/delete-package-versions@v5
        with:
          package-name: amiga-fsuae
          package-type: container
          min-versions-to-keep: 10
      - name: Keep the newest 10 versions of amiga-fsuae-aros
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/delete-package-versions@v5
        with:
          package-name: amiga-fsuae-aros
          package-type: container
          min-versions-to-keep: 10

  # a closed pull request leaves no image: its pr-<number> versions and the
  # untagged versions of the -pr packages go
  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Delete the pull request images
        env:
          PR: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for image in amiga-fsuae-pr amiga-fsuae-aros-pr; do
            gh api --paginate "/users/pulchart/packages/container/$image/versions" \
              --jq ".[] | select(.metadata.container.tags == [\"pr-$PR\"] or .metadata.container.tags == []) | .id" |
              while read -r id; do
                gh api -X DELETE "/users/pulchart/packages/container/$image/versions/$id"
              done
          done
